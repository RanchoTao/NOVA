[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nova-innovation"
version = "0.1.0"
description = "NOVA: an assumption-breaking scientific ideation workbench"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "RanchoTao"}]
keywords = ["research", "ideation", "scientific-discovery", "agent"]
dependencies = []

[project.scripts]
nova = "nova.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nova = ["seeds.json", "static/*.html"]
